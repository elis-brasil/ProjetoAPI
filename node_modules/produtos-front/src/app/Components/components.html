<div class="max-container">
  <h2>Gerenciador de Produtos</h2>

  <!-- Formulário -->
  <form (ngSubmit)="saveProduct()">
    <div class="form-group">
      <label for="productName">Nome do Produto:</label>
      <input type="text" id="productName" name="nome" [(ngModel)]="currentProduct.nome" required>
    </div>
    <div class="form-group">
      <label for="productPrice">Preço (R$):</label>
      <input type="number" id="productPrice" name="preco" step="0.01" [(ngModel)]="currentProduct.preco" required>
    </div>
    <div class="form-group">
      <label for="productQuantity">Quantidade:</label>
      <input type="number" id="productQuantity" name="quantidade" [(ngModel)]="currentProduct.quantidade" required>
    </div>

    <button type="submit" class="btn-submit">
      {{ isEditMode ? 'Atualizar Produto' : 'Salvar Produto' }}
    </button>
    
  </form>

  <!-- Tabela de Produtos -->
  <h3>Lista de Produtos</h3>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Preço</th>
        <th>Quantidade</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let produto of Produtos">
        <td>{{ produto.id }}</td>
        <td>{{ produto.nome }}</td>
        <td>R$ {{ produto.preco | number:'1.2-2' }}</td>
        <td>{{ produto.quantidade }}</td>
        <td>
          <button class="btn-edit" (click)="fillFormForEdit(produto)">Editar</button>
          <button class="btn-delete" (click)="deleteProduct(produto .id)">Deletar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
